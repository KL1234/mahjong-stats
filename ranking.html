<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜 - 麻將統計</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1><a href="index.html">🀄 麻將統計</a></h1>
    <div id="auth-area"></div>
  </header>

  <main>
    <a href="index.html" class="back-link">← 返回列表</a>

    <section class="toolbar">
      <h2>🏆 排行榜（四人合併）</h2>
      <div class="toolbar-actions">
        <label class="threshold-picker">
          最少對局數
          <select id="threshold-select">
            <option value="0">不限</option>
            <option value="10">10 局</option>
            <option value="50">50 局</option>
            <option value="100" selected>100 局</option>
            <option value="200">200 局</option>
            <option value="500">500 局</option>
          </select>
        </label>
      </div>
    </section>

    <p id="status-line" class="hint"></p>

    <div id="ranking-grid" class="ranking-grid">
      <p class="loading">載入中...</p>
    </div>
  </main>

  <div id="login-modal" class="modal" hidden>
    <div class="modal-content">
      <h3>登入</h3>
      <form id="login-form">
        <label>
          帳號
          <input type="text" id="login-id" required autocomplete="username">
        </label>
        <label>
          密碼
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <p id="login-error" class="error"></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>取消</button>
          <button type="submit" class="btn-primary">登入</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/ranking.js"></script>
</body>
</html>
