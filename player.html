<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雀士詳情 - 麻將統計</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1><a href="index.html">🀄 麻將統計</a></h1>
    <div id="auth-area"></div>
  </header>

  <main>
    <a href="index.html" class="back-link">← 返回列表</a>
    <div id="player-detail">
      <p class="loading">載入中...</p>
    </div>
  </main>

  <div id="login-modal" class="modal" hidden>
    <div class="modal-content">
      <h3>登入</h3>
      <form id="login-form">
        <label>
          帳號
          <input type="text" id="login-id" required placeholder="例：admin" autocomplete="username">
        </label>
        <label>
          密碼
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <p id="login-error" class="error"></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>取消</button>
          <button type="submit" class="btn-primary">登入</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/player.js"></script>
</body>
</html>
