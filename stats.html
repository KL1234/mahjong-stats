<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計項目管理 - 麻將統計</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1><a href="index.html">🀄 麻將統計</a></h1>
    <div id="auth-area"></div>
  </header>

  <main>
    <a href="index.html" class="back-link">← 返回列表</a>

    <section>
      <h2>統計項目管理</h2>
      <p class="hint">
        在這裡新增、改名或刪除統計項目（例：和牌率、寶牌率）。所有雀士共用同一份項目清單。<br>
        <strong>數值型別：</strong>百分比 / 整數 / 小數。<br>
        <strong>合併方式：</strong>加權平均（一般機率類）、加總（如「總對局數」）、取最大（如「最大連莊」）。
      </p>

      <div id="stats-list-area">
        <p class="loading">載入中...</p>
      </div>

      <form id="add-stat-form" class="stat-form auth-only" hidden>
        <h3>新增項目</h3>
        <div class="form-row">
          <label>
            名稱
            <input type="text" id="new-stat-name" required maxlength="30" placeholder="例：和牌率">
          </label>
          <label>
            數值型別
            <select id="new-stat-type">
              <option value="percent">百分比 (%)</option>
              <option value="integer">整數</option>
              <option value="decimal">小數</option>
            </select>
          </label>
          <label>
            合併方式
            <select id="new-stat-agg">
              <option value="weighted_avg">加權平均</option>
              <option value="sum">加總</option>
              <option value="max">取最大</option>
            </select>
          </label>
          <label>
            分類
            <select id="new-stat-category">
              <option value="basic">基礎統計</option>
              <option value="win_dist">和牌分布</option>
              <option value="style">風格屬性</option>
              <option value="yaku_normal">番數達成次數</option>
              <option value="yaku_dora">寶牌</option>
              <option value="yaku_yakuman">役滿</option>
            </select>
          </label>
          <label>
            場別劃分
            <select id="new-stat-scope">
              <option value="per_mode">分東/南場 (per_mode)</option>
              <option value="merged_only">不分東南 (merged_only)</option>
            </select>
          </label>
          <button type="submit" class="btn-primary">新增</button>
        </div>
      </form>

      <p id="auth-hint" class="hint" hidden>登入後可編輯統計項目。</p>
    </section>
  </main>

  <div id="login-modal" class="modal" hidden>
    <div class="modal-content">
      <h3>登入</h3>
      <form id="login-form">
        <label>
          帳號
          <input type="text" id="login-id" required autocomplete="username">
        </label>
        <label>
          密碼
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <p id="login-error" class="error"></p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>取消</button>
          <button type="submit" class="btn-primary">登入</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/stats.js"></script>
</body>
</html>
